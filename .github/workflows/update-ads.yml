name: Daily AD RADAR crawl

on:
  workflow_dispatch:
  schedule:
    # 06:30 KST = 21:30 UTC (previous day)
    - cron: '30 21 * * *'
  push:
    paths:
      - 'trigger-first-run.txt'

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Discover, watch, translate and curate ads
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LOOKBACK_HOURS: '168'
          MAX_PER_QUERY: '10'
          MAX_ANALYZE: '24'
        run: python scripts/update_ads.py
      - name: Commit archive and candidate ledger
        run: |
          if [ -z "$(git status --porcelain -- data/ads.json data/seen.json)" ]; then
            echo "No changes"
            exit 0
          fi
          git config user.name "ad-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ads.json data/seen.json
          git commit -m "Update daily ad archive"
          git push
